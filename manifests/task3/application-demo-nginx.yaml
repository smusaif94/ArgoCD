apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-nginx
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: poc-demo
  source:
    # TODO: Replace your-username and your-repo-name with actual values (example: https://github.com/yourname/argocd-demo.git).
    repoURL: https://github.com/your-username/your-repo-name.git
    targetRevision: main
    path: helm/task2-nginx
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
