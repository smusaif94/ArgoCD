apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: poc-demo
  namespace: argocd
spec:
  description: Project for Task 3 ArgoCD learning deployment
  # TODO: Replace your-username and your-repo-name with actual values (example: https://github.com/yourname/argocd-demo.git).
  sourceRepos:
    - https://github.com/your-username/your-repo-name.git
  destinations:
    - namespace: demo-*
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
