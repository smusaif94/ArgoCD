apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: poc-demo
  namespace: argocd
spec:
  description: Project for Task 3 ArgoCD learning deployment
  # Replace with your actual Git repository URL before applying (example: https://github.com/yourname/argocd-demo.git).
  sourceRepos:
    - https://github.com/REPLACE_WITH_YOUR_USERNAME/REPLACE_WITH_YOUR_REPO.git
  destinations:
    - namespace: demo-*
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
